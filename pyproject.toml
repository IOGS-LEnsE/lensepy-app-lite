[project]
name = "lensepy-app-lite"
version = "1.0.2"
authors = [
  { name="Julien VILLEMEJANE", email="julien.villemejane@institutoptique.fr" },
]
description = "LEnsE Package of applications. Required lensepy package. LITE Version"
readme = "README.rst"
requires-python = ">=3.11"

dependencies = [
    "pyqt6>=6.1",
    "PyQt6-WebEngine",
    "lensepy>=3",
    "pyqtgraph>=0.12",
	"pypylon"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/IOGS-LEnsE/lensepy-app-lite"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lensepy_app_lite"]

[tool.setuptools.package-data]
# File to include
"lensepy_app_lite" = ["**/*.xml", "**/*.jpg"]